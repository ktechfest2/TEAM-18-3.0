<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Subscription plans</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/269c53a3ed7b6aa8189bcf063b15c59c">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#0A6B45}a:hover{color:#064D31}</style>
</helmet>
<div class="scr">
<div class="top">
<a class="ibtn" href="Profile.dc.html" aria-label="Back"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></a>
<h1 class="t-title">Plans</h1>
</div>
<div class="content" style="gap: 12px">
<div class="priv">
<svg class="ic s" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg>
<span>Reporting that you voted, incident reports and safety alerts are <strong>always free</strong>.</span>
</div>
<div class="grid3" style="gap: 8px">
<sc-for list="{{plans}}" as="p" hint-placeholder-count="3">
<button type="button" onClick="{{p.pick}}" style="{{p.style}}">
<span style="font-size: 13px; font-weight: 700">{{p.name}}</span>
<span style="font-size: 17px; font-weight: 800">{{p.price}}</span>
<span style="font-size: 11px; opacity: 0.75">{{p.per}}</span>
</button>
</sc-for>
</div>
<div class="card" style="padding: 4px 14px">
<sc-for list="{{features}}" as="f" hint-placeholder-count="8">
<div class="li" style="padding: 10px 0">
<span class="grow" style="font-size: 13.5px; font-weight: 600">{{f.label}}</span>
<span style="{{f.style}}">{{f.value}}</span>
</div>
</sc-for>
</div>
</div>
<div class="foot">
<a class="btn" href="Profile.dc.html">{{cta}}</a>
<p class="sm" style="text-align: center">Pay by card, transfer or USSD. Cancel anytime.</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const sel = (this.state && this.state.sel) || 'std';
const plans = [
{ id: 'free', name: 'Free', price: '₦0', per: 'forever' },
{ id: 'std', name: 'Standard', price: '₦5,000', per: 'per month' },
{ id: 'prem', name: 'Premium', price: '₦10,000', per: 'per month' }
];
const rows = [
['Registration & language', 'Yes', 'Yes', 'Yes'],
['Submit participation & reports', 'Yes', 'Yes', 'Yes'],
['Basic news & essential alerts', 'Yes', 'Yes', 'Yes'],
['General leaderboard', 'Limited', 'Yes', 'Yes'],
['Detailed location leaderboards', 'No', 'Yes', 'Yes'],
['Advanced analytics', 'No', 'Limited', 'Yes'],
['Create & publish events', 'No', 'No', 'Yes'],
['Event promotion & ticketing', 'No', 'No', 'Yes']
];
const idx = { free: 1, std: 2, prem: 3 }[sel];
const pill = { Yes: 'background: #E4F1EA; color: #064D31', Limited: 'background: #FDF3DC; color: #6E4700', No: 'background: #EBEEEA; color: #56635B' };
const current = 'std';
return {
plans: plans.map((p) => ({
...p,
pick: () => this.setState({ sel: p.id }),
style: 'display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 12px; border-radius: 14px; font-family: inherit; text-align: left; ' +
(p.id === sel ? 'background: #0E1B14; color: #FFFFFF; border: 1.5px solid #0E1B14' : 'background: #FFFFFF; color: #0E1B14; border: 1px solid #E2E6E0')
})),
features: rows.map((r) => ({ label: r[0], value: r[idx], style: 'font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 99px; ' + pill[r[idx]] })),
cta: sel === current ? 'Your current plan' : (sel === 'free' ? 'Switch to Free' : 'Upgrade to ' + plans.find((p) => p.id === sel).name)
};
}
}
</script>
</body>
</html>
