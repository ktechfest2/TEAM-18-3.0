<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Report an incident</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/269c53a3ed7b6aa8189bcf063b15c59c">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#0A6B45}a:hover{color:#064D31}</style>
</helmet>
<div class="scr">
<div class="top">
<a class="ibtn" href="Report.dc.html" aria-label="Back"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></a>
<h1 class="t-title">Report an incident</h1>
</div>
<div class="content" style="gap: 14px">
<p class="flabel">What happened?</p>
<div class="grid3" style="gap: 8px; margin-top: -6px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
<button type="button" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>
<a class="card row" href="#" style="padding: 12px 14px; text-decoration: none; color: #0E1B14">
<span class="tile t-n" style="width: 38px; height: 38px"><svg class="ic s" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></span>
<span class="grow"><span class="h3" style="display: block; font-size: 14px">PU 007 · Arab Road Junction</span><span class="sm">Kubwa · Bwari · FCT</span></span>
<span class="link" style="font-size: 13px">Change</span>
</a>
<div class="grid2" style="gap: 10px">
<div class="field"><label for="dt">Date</label><input class="inp" id="dt" value="Today" style="height: 44px"></div>
<div class="field"><label for="tm">Time</label><input class="inp" id="tm" value="10:05 AM" style="height: 44px"></div>
</div>
<div class="field"><label for="ds">Describe what you saw</label><textarea class="inp" id="ds" style="height: 92px">Two men near the queue offering cash to voters to show their ballot before casting it.</textarea></div>
<div class="row" style="gap: 8px">
<button class="chip" type="button" style="height: 40px"><svg class="ic s" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Photo</button>
<button class="chip" type="button" style="height: 40px"><svg class="ic s" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg>Video</button>
<button class="chip" type="button" style="height: 40px"><svg class="ic s" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Audio</button>
<span class="hint">Optional</span>
</div>
<div class="card row" style="padding: 12px 14px">
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: #0A6B45"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/></svg>
<span class="grow"><span class="h3" style="display: block; font-size: 14px">Report anonymously</span><span class="sm">Your identity is hidden from public alerts</span></span>
<span class="sw on" role="img" aria-label="On"></span>
</div>
</div>
<div class="foot">
<a class="btn" href="IncidentDone.dc.html" style="background: #B42318">Submit incident report</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const sel = (this.state && this.state.sel) || 'buy';
const list = [
{ id: 'mal', label: 'Malpractice' },
{ id: 'int', label: 'Intimidation' },
{ id: 'vio', label: 'Violence' },
{ id: 'buy', label: 'Vote buying' },
{ id: 'dis', label: 'Disruption' },
{ id: 'oth', label: 'Other' }
];
const base = 'height: 44px; border-radius: 12px; font-family: inherit; font-size: 13px; font-weight: 600; ';
return {
cats: list.map((c) => ({
...c,
style: base + (c.id === sel ? 'background: #FDECEA; border: 1.5px solid #B42318; color: #B42318' : 'background: #FFFFFF; border: 1px solid #E2E6E0; color: #0E1B14'),
pick: () => this.setState({ sel: c.id })
}))
};
}
}
</script>
</body>
</html>
